name: Fuzz

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Run fuzz.py
        run: |
          python fuzz.py

      - name: Save fuzz results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz_results.log
          path: /home/runner/work/solo-FALL2025-SQA/solo-FALL2025-SQA/fuzz_results.log
